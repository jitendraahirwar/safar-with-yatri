<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सफ़र विथ यात्री - नरसिंहगढ़ फोर्ट ट्रिप</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #ff5722;
            --whatsapp-color: #25d366;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-yellow: #ffb703;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            display: flex;
            justify-content: center;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            background: #1e293b;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            padding-bottom: 95px;
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.9)), 
                        url('https://i.ibb.co/3m453g7/narsinghgarh-bg.jpg') center/cover;
            padding: 40px 20px 30px;
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
        }

        .brand-badge {
            background: rgba(255, 87, 34, 0.2);
            border: 1px solid var(--primary-color);
            color: var(--accent-yellow);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            display: inline-block;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .hero h1 {
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .hero p.subtitle {
            color: #cbd5e1;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .slogan-box {
            background: rgba(255, 183, 3, 0.15);
            border-left: 4px solid var(--accent-yellow);
            padding: 10px 12px;
            margin: 10px 0 20px 0;
            font-size: 0.85rem;
            color: #ffb703;
            font-weight: 600;
            border-radius: 0 8px 8px 0;
        }

        .price-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 2px dashed var(--accent-yellow);
            border-radius: 12px;
            padding: 15px;
            margin: 0 auto;
            max-width: 260px;
        }

        .price-box h2 {
            font-size: 2.2rem;
            color: var(--accent-yellow);
        }

        .section-title {
            font-size: 1.2rem;
            margin: 25px 20px 15px;
            color: var(--accent-yellow);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 20px;
        }

        .info-card {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #334155;
            text-align: center;
        }

        .info-card i {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .info-card h4 {
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .info-card p {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* Media Cards & Gallery */
        .media-card {
            margin: 15px 20px;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .media-card img {
            width: 100%;
            height: auto;
            max-height: 280px;
            object-fit: cover;
            display: block;
        }

        .media-details {
            padding: 12px;
            text-align: center;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 20px;
        }

        .gallery-grid img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        /* Fixed Bottom WhatsApp CTA */
        .fixed-cta {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: #0f172a;
            padding: 12px 20px;
            border-top: 1px solid #334155;
            box-sizing: border-box;
            text-align: center;
            z-index: 999;
        }

        .btn-whatsapp {
            background: var(--whatsapp-color);
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 30px;
            font-size: 1.1rem;
